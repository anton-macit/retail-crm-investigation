<script>
	var _rcct = "605fa90f6f603c4bed1fb942b68af615c4be86e6aee5023ce8f7ee9d4a5bf764";
	!function (t) {
		var a = t.getElementsByTagName("head")[0];
		var c = t.createElement("script");
		c.type = "text/javascript";
		c.src = "//c.retailcrm.tech/widget/loader.js";
		a.appendChild(c);
	}(document);

	function isPlainObject(value) {
		return (
			typeof value === 'object' && // Check if it's an object type
			value !== null && // Exclude null (which also returns "object")
			!Array.isArray(value) // Explicitly exclude arrays
		);
	}

	function getCookies() {
		const cArr = document.cookie.split('; ');
		const cObj = {};

		cArr.forEach(function (cRaw) {
			const cSpl = cRaw.split('=');
			cObj[cSpl[0]] = cSpl[1];

		});

		return cObj;
	}



	function objectToArray(obj, prefix="") {
		const result = [];
		for (let key in obj) {
			if (obj.hasOwnProperty(key)) { // Проверка на "собственное" свойство
				let property = obj[key];
				if (isPlainObject(property))  {
					result.push(...objectToArray(property, `${key}.`))
                } else {
					let propertyName = `${prefix}${key}`;
					result.push(`${encodeURI(propertyName)}=${encodeURI(property)}`)
                }
			}
		}
		return result;
	}

	function addAlignedEnvyBoxData(event, type) {
		const result = [];
		result.push(`webhooktype=${type === 'online' ? 12 : 8}`);

		const cookies = getCookies();
		const mgo_uid = cookies['mgo_uid'];
		if (mgo_uid) {
			result.push(`custom_data=['mgo_uid:${mgo_uid}']`);
		}

		const phone = event.data.phone;
		if (phone) {
			result.push(`phone=${phone}`);
		}

		result.push(`name=${event.data.name}`);
		result.push(`email=${event.data.email}`);

		return result;
	}

	function sendEventToMango(event, type) {
		const formattedEvent = objectToArray(event);

		formattedEvent.push(...addAlignedEnvyBoxData(event, type));

		// todo - а всякие CORS разрешат такое?
		fetch('https://widgets-api-dev-ru.mango-office.ru/v1/webhook/envybox/MTM3NTI=?access_token=e82c59e1d1f7bda2bfbf029874c14ddfa8f0a001', {
			method: 'POST',
			headers: {
				'Content-Type': 'application/x-www-form-urlencoded',
			},
			body: JSON.stringify(formattedEvent.join("&"))
		})
			.then(response => response.json()) // Parse the JSON response from the server
			.then(data => console.log('Result: ', JSON.stringify(data))) // Log the response data
			.catch(error => console.error('Error:', JSON.stringify(error))); // Handle network errors
	}

	function onOcapiReady() {
		window.ocapi.on('load', () => {
			console.debug('Consultant has been loaded!');
		});

		window.ocapi.on('contact_form', (event
		) => {
			console.debug('Event contact_form!', JSON.stringify(event));
			sendEventToMango(event, 'online');
		});

		window.ocapi.on('offline_form', (event
		) => {
			console.debug('Event offline_form!', JSON.stringify(event));
			sendEventToMango(event, 'offline');
		});
	}

	const intervalWaitingOcapi = setInterval(function() { // todo - как насчет такого решения?
		if (window.ocapi) {
            onOcapiReady();

			clearInterval(intervalWaitingOcapi);
		}

	}, 1000);
</script>
