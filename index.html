<!-- mango new script for integrations -->
<script>
	function getCookies() {
		const cArr = document.cookie.split('; ');
		const cObj = {};

		cArr.forEach(function (cRaw) {
			const cSpl = cRaw.split('=');
			cObj[cSpl[0]] = cSpl[1];

		});

		return cObj;
	}

	function alignedEnvyBoxData(event, type) {
		const result = [];
		result.push(`webhooktype=${type === 'online' ? 12 : 8}`);

        const cookies = getCookies();
        const mgo_uid = cookies['mgo_uid'];
        if (mgo_uid) {
	        const custom_data = [`mgo_uid:${mgo_uid}`];
	        result.push(`custom_data=${encodeURI(JSON.stringify(custom_data))}`);
			result.push(`uid=${mgo_uid}`);
        }

		const phone = event.data.phone;
		if (phone) {
			result.push(`phone=${phone}`);
		}

		result.push(`name=${encodeURI(event.data.name)}`);
		result.push(`email=${encodeURI(event.data.email)}`);
		result.push(`ip=127.0.0.1`); // todo - fake ip
        result.push(`url=${encodeURI(window.location.href)}`);

		// todo - так же следует попробовать передать utm метки и в случае если мы будем создавать событие из webhook - то положить корректные utm

		return result;
	}

	function sendEventToMango(event, type) {
		// todo - а всякие CORS разрешат такое? - лучше перейти на GET
		fetch('https://widgets-api-dev-ru.mango-office.ru/v1/webhook/envybox/MTM3NTI=?access_token=e82c59e1d1f7bda2bfbf029874c14ddfa8f0a001', {
			method: 'POST',
			headers: {
				'Content-Type': 'application/x-www-form-urlencoded',
			},
			body: alignedEnvyBoxData(event, type).join("&")
		})
			.then(response => response.json()) // Parse the JSON response from the server
			.then(data => console.log('Result: ', JSON.stringify(data))) // Log the response data
			.catch(error => console.error('Error:', JSON.stringify(error))); // Handle network errors
	}

	function onOcapiReady() {
		window.ocapi.on('load', () => {
			console.debug('Consultant has been loaded!');
		});

		window.ocapi.on('contact_form', (event
		) => {
			console.debug('Event contact_form!', JSON.stringify(event));
			sendEventToMango(event, 'online');
		});

		window.ocapi.on('offline_form', (event
		) => {
			console.debug('Event offline_form!', JSON.stringify(event));
			sendEventToMango(event, 'offline');
		});
	}

	const intervalWaitingOcapi = setInterval(function() {
		if (window.ocapi) {
			clearInterval(intervalWaitingOcapi);

            onOcapiReady();
		}

	}, 500);
</script>
